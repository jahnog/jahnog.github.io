<script>
  (function () {
    if (location.hostname !== "jahnog.github.io") {
      return;
    }
    var _paq = (window._paq = window._paq || []);
    _paq.push(["disableCookies"]);
    var path = location.pathname.replace(/\/index\.html$/i, "/");
    if (path !== "/" && path.slice(-1) !== "/") {
      path += "/";
    }
    _paq.push(["setCustomUrl", location.origin + path + location.search]);
    _paq.push(["setDocumentTitle", document.title]);
    _paq.push(["trackPageView"]);
    _paq.push(["enableLinkTracking"]);
    _paq.push(["enableHeartBeatTimer", 15]);
    (function () {
      var u = "https://contentlabstudy.com/Mat0mo/";
      _paq.push(["setTrackerUrl", u + "matomo.php"]);
      _paq.push(["setSiteId", "4"]);
      var d = document,
        g = d.createElement("script"),
        s = d.getElementsByTagName("script")[0];
      g.async = true;
      g.src = u + "matomo.js";
      s.parentNode.insertBefore(g, s);
    })();
    document.addEventListener(
      "click",
      function (event) {
        var node = event.target;
        if (node && node.nodeType !== 1) {
          node = node.parentElement;
        }
        var link = node && node.closest ? node.closest("a[href]") : null;
        if (!link) {
          return;
        }
        try {
          var dest = new URL(link.href, location.href);
          var p = dest.pathname;
          if (
            dest.hostname === "jahnog.github.io" &&
            (p === "/CuratedSkills" || p.indexOf("/CuratedSkills/") === 0)
          ) {
            _paq.push(["trackEvent", "outbound", "demo", dest.href]);
          }
        } catch (err) {
          /* ignore invalid href */
        }
      },
      true
    );
  })();
</script>
