<footer class="wl-footer">
  <p class="footer-links">
    {% for link in site.footer.links %}
      <a href="{{ link.url }}" rel="me noopener">{{ link.label }}</a>
    {% endfor %}
    <a href="https://github.com/{{ site.repository }}">Site source</a>
    <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
  </p>
  <p>
    &copy; {{ site.time | date: "%Y" }} {{ site.author.name | default: site.title }}.
    Cookieless Matomo, first-party.
  </p>
</footer>
