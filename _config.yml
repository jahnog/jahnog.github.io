# Jekyll configuration.
#
# This file is NOT reloaded automatically by `jekyll serve`. Restart the
# server process after editing it.
#
# The site is built from local layouts in _layouts and _includes, styled by
# assets/css/weblab.css (vendored from the sibling WebLook repo) plus a small
# assets/css/site.css. No theme gem, and no theme is fetched remotely.

# Site Settings
locale                   : "en-US"
title                    : "Javier Nogueira"
title_separator          : "-"
subtitle                 : "Senior software engineer · AI systems (RAG, agents) · remote"
tagline                  : "Senior software engineer · AI systems (RAG, agents) · remote" # jekyll-seo-tag page titles
name                     : "Javier Nogueira"
description              : "Senior software engineer. Backend systems, cited RAG, coding agents, and earlier work in machine learning, simulation, and data analysis."
url                      : "https://jahnog.github.io"
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : jahnog/jahnog.github.io
teaser                   : /assets/images/800px-MultiLayerNeuralNetworkBigger_english.png # fallback card image
logo                     : # wordmark only; Scream asset stays on disk, not in chrome

# Home page hero. The topbar already carries the wordmark and the role line,
# so this is a statement, not a repeat.
hero:
  title: "Backend systems and AI features that cite their sources — or stay quiet."
  text: "Cited RAG over regulation, a spec-first security CLI, a curated registry of coding-agent skills, and earlier work in machine learning, simulation, and data analysis. About 30 years in production software, remote."

# SEO Related
google_site_verification : # paste a Search Console verification token here to enable indexing verification
bing_site_verification   :

# Social Sharing
og_image                 : /assets/images/800px-MultiLayerNeuralNetworkBigger_english.png # Open Graph/Twitter default site image
twitter:
  card                   : summary_large_image
social:
  type                   : Person
  name                   : "Javier Nogueira"
  links:
    - "https://www.linkedin.com/in/jntech/"
    - "https://github.com/jahnog"

# Analytics — cookieless, first-party Matomo. See _includes/analytics.html,
# which no-ops off the production hostname.
analytics:
  provider               : "custom"

# Site Author
author:
  name             : "Javier Nogueira"
  avatar           : /assets/images/the_scream_98x98.jpg
  bio              : "Senior software engineer. AI systems (RAG, agents)."
  links:
    - label: "GitHub"
      url: "https://github.com/jahnog"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/jntech/"

# Site Footer
footer:
  links:
    - label: "GitHub"
      url: "https://github.com/jahnog"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/jntech/"


# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - LICENSE
  - log
  - node_modules
  - README
  - tmp
  - scripts # dev tooling, not part of the published site
  - openspec # planning artifacts, not part of the published site
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Outputting
# Posts carry no categories, so this resolves to /:title/. Changing it would
# break every existing post URL.
permalink: /:categories/:title/
paginate: 5
paginate_path: /writing/page:num/
timezone:


# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-seo-tag

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-seo-tag


# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: post
