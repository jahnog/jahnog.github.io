<!DOCTYPE html>
<html lang="{{ site.locale | slice: 0, 2 | default: 'en' }}" class="wl-page">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link wl-btn wl-btn-primary" href="#main">Skip to content</a>

    <div class="wl-shell wl-fill">
      {% include header.html %}

      <main class="wl-main" id="main">
        {{ content }}
      </main>

      {% include footer.html %}
    </div>

    {% if site.analytics.provider == "custom" %}
      {% include analytics.html %}
    {% endif %}
  </body>
</html>
