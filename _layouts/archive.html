---
layout: default
---

<header class="post-header">
  <h1 class="wl-title wl-title-lg">{{ page.title }}</h1>
</header>

{% if content != "" %}
  <div class="wl-prose">{{ content }}</div>
{% endif %}

<div class="wl-card-grid">
  {% for post in site.posts %}
    {% include post-card.html post=post type="grid" %}
  {% endfor %}
</div>
